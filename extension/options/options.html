<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Recruiting Buddy</title>
<style>body{font:14px system-ui,sans-serif;max-width:560px;margin:24px}input{width:100%;box-sizing:border-box}code{background:#f1f3f4;padding:1px 4px}#status{min-height:1.2em;margin-top:8px}#pending{color:#555;margin-top:4px}</style>
</head>
<body>
<h1>Recruiting Buddy</h1>
<p>Paste a HubSpot private-app token (Settings &rarr; Integrations &rarr; Private Apps). Required scope: <code>crm.objects.contacts.read</code> for the connection test; search logging needs <code>crm.objects.notes.write</code> on first log.</p>
<label>Private-app token<br><input id="token" type="password" autocomplete="off" spellcheck="false"></label>
<p><button id="save">Save</button> <button id="test">Test connection</button></p>
<div id="status" role="status"></div>
<div id="pending"></div>
<script src="options.js"></script>
</body>
</html>
